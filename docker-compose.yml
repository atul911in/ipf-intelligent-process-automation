version: "3.9"

# IPF IPA PoC - Docker Compose
# Full stack: Backend API + Admin UI + Reviewer UI
# External services (Supabase, OpenAI) configured via .env

services:

  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    ports:
      - "8000:8000"
    environment:
      - SUPABASE_URL=
      - SUPABASE_KEY=
      - SUPABASE_SERVICE_KEY=
      - SUPABASE_BUCKET=
      - SUPABASE_DB_PASSWORD=
      - OPENAI_API_KEY=
      - OPENAI_MODEL=
      - CONFIDENCE_THRESHOLD=
    volumes:
      - ./src:/app/src
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  admin-ui:
    build:
      context: .
      dockerfile: docker/streamlit.Dockerfile
    ports:
      - "8501:8501"
    environment:
      - BACKEND_URL=http://backend:8000
      - ADMIN_PASSWORD=
    command: streamlit run src/admin_ui/app.py --server.port 8501 --server.address 0.0.0.0
    volumes:
      - ./src:/app/src
    depends_on:
      - backend
    restart: unless-stopped

  reviewer-ui:
    build:
      context: .
      dockerfile: docker/streamlit.Dockerfile
    ports:
      - "8502:8502"
    environment:
      - BACKEND_URL=http://backend:8000
      - REVIEWER_PASSWORD=
      - ASSESSOR_PASSWORD=
    command: streamlit run src/reviewer_ui/reviewer_app.py --server.port 8502 --server.address 0.0.0.0
    volumes:
      - ./src:/app/src
    depends_on:
      - backend
    restart: unless-stopped
